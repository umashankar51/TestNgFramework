# Default Test Properties
# ─────────────────────────────────────────────────────────────────────────────
# Xray / Jira Config
# Override any value via Azure env var (same name, upper-case) or -D system property
# ─────────────────────────────────────────────────────────────────────────────
jira_base_url        = https://your-org.atlassian.net
jira_email           = your.email@company.com
jira_api_token       = YOUR_JIRA_API_TOKEN
xray_client_id       = YOUR_XRAY_CLIENT_ID
xray_client_secret   = YOUR_XRAY_CLIENT_SECRET
xray_project_key     = YOUR_PROJECT_KEY
# Leave blank — pass XRAY_EXECUTION_KEY as an Azure pipeline variable/parameter
xray_execution_key   =
# Set true to auto-create a Test Execution when no key is provided
xray_create_new      = false
# ─────────────────────────────────────────────────────────────────────────────
testenv = qa
groups_included = regression
groups_excluded = broken
headless = false

# BrowserStack Credentials
bs_username = YOUR_BS_USERNAME
bs_accessKey = YOUR_BS_ACCESS_KEY
bs_projectName = TCS Mobile Tests
bs_buildName = Build 1.0

# Android Device Config
android_deviceName = Samsung Galaxy S23
android_platformVersion = 13.0
android_app = bs://YOUR_ANDROID_APP_ID
android_appVersion =

# iOS Device Config
ios_deviceName = iPhone 15
ios_platformVersion = 17
ios_app = bs://YOUR_IOS_APP_ID
iOS_appVersion =
