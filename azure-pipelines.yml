# Mobile Test Automation — Azure Pipelines
# Runs TestNG suite, publishes Extent report, sends email via SendGrid

trigger: none

parameters:

  - name: environment
    displayName: 'Environment'
    type: string
    default: 'qa'
    values:
      - qa
      - staging
      - prod

  - name: agentPool
    displayName: 'Run On Agent'
    type: string
    default: 'ubuntu-latest'
    values:
      - ubuntu-latest
      - windows-latest
      - macos-latest
      - Self-Hosted-Linux
      - Self-Hosted-Windows

  - name: groups
    displayName: 'Include Group'
    type: string
    default: 'regression'
    values:
      - regression
      - smoke
      - iOS
      - android

  - name: excludedGroups
    displayName: 'Exclude Group (select none to skip)'
    type: string
    default: 'none'
    values:
      - none
      - invalid
      - defect

  - name: emailFrom
    displayName: 'From Email'
    type: string
    default: 'automation@yourcompany.com'

  - name: emailTo
    displayName: 'To Emails (comma-separated)'
    type: string
    default: 'qa-team@yourcompany.com'

  - name: emailCC
    displayName: 'CC Emails (comma-separated, leave blank for none)'
    type: string
    default: ''

variables:
  - group: sendgrid-secrets

pool:
  vmImage: ${{ parameters.agentPool }}

steps:

  - task: PowerShell@2
    displayName: 'Resolve Test Groups'
    inputs:
      targetType: inline
      script: |
        $groupsStr   = '${{ parameters.groups }}'
        $excludedRaw = '${{ parameters.excludedGroups }}'
        $excludedStr = if ($excludedRaw -eq 'none') { '' } else { $excludedRaw }

        Write-Host "##vso[task.setvariable variable=MAVEN_GROUPS]$groupsStr"
        Write-Host "##vso[task.setvariable variable=MAVEN_EXCLUDED]$excludedStr"

        Write-Host "Environment    : ${{ parameters.environment }}"
        Write-Host "Agent Pool     : ${{ parameters.agentPool }}"
        Write-Host "Groups         : $groupsStr"
        Write-Host "Excluded Groups: $(if ($excludedStr -eq '') { '(none)' } else { $excludedStr })"

  - task: Maven@3
    displayName: 'Run TestNG Suite'
    inputs:
      mavenPomFile: 'pom.xml'
      mavenOptions: '-Xmx3072m'
      javaHomeOption: 'JDKVersion'
      jdkVersionOption: '21'
      jdkArchitectureOption: 'x64'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      goals: 'clean test -Denv=${{ parameters.environment }} -Dgroups=$(MAVEN_GROUPS) -DexcludedGroups=$(MAVEN_EXCLUDED)'

  - task: PublishHtmlReport@1
    displayName: 'Publish Extent Report'
    condition: always()
    inputs:
      reportDir: '$(System.DefaultWorkingDirectory)'
      tabName: 'Extent Report'

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Allure Results'
    condition: always()
    inputs:
      pathToPublish: '$(System.DefaultWorkingDirectory)/target/allure-results'
      artifactName: 'allure-results'

  - task: PowerShell@2
    displayName: 'Send Report Email (SendGrid)'
    condition: always()
    env:
      SENDGRID_API_KEY: $(SENDGRID_API_KEY)
    inputs:
      targetType: inline
      script: |
        $reportFiles = Get-ChildItem -Path "$(System.DefaultWorkingDirectory)/test-output/extent-reports" `
                                     -Filter "*.html" -Recurse -ErrorAction SilentlyContinue |
                       Sort-Object LastWriteTime -Descending

        if ($reportFiles.Count -gt 0) {
            $reportPath = $reportFiles[0].FullName
            Write-Host "Using report: $reportPath"
            $htmlBody = Get-Content -Path $reportPath -Raw -Encoding UTF8
        } else {
            Write-Warning "No Extent HTML report found - sending fallback email."
            $htmlBody = "<h2>Test Execution Report</h2><p>No HTML report was generated. Please check pipeline logs.</p><ul><li><b>Build ID:</b> $(Build.BuildId)</li><li><b>Environment:</b> ${{ parameters.environment }}</li><li><b>Groups:</b> $(MAVEN_GROUPS)</li><li><b>Excluded:</b> $(MAVEN_EXCLUDED)</li></ul>"
        }

        function ConvertTo-EmailList([string]$raw) {
            return ($raw.Split(',') |
                    ForEach-Object { $_.Trim() } |
                    Where-Object   { $_ -ne ''  } |
                    ForEach-Object { @{ email = $_ } })
        }

        $toList = ConvertTo-EmailList '${{ parameters.emailTo }}'
        $ccList = ConvertTo-EmailList '${{ parameters.emailCC }}'

        if ($toList.Count -eq 0) {
            Write-Error "No To email addresses provided."
            exit 1
        }

        $subject = "[${{ parameters.environment }}] Test Report - Build $(Build.BuildId) | Groups: $(MAVEN_GROUPS)"

        $personalization = @{ to = $toList; subject = $subject }
        if ($ccList.Count -gt 0) { $personalization['cc'] = $ccList }

        $payload = @{
            personalizations = @($personalization)
            from             = @{ email = '${{ parameters.emailFrom }}'; name = 'Azure Test Automation' }
            subject          = $subject
            content          = @(@{ type = 'text/html'; value = $htmlBody })
        } | ConvertTo-Json -Depth 10

        $headers = @{
            'Authorization' = "Bearer $env:SENDGRID_API_KEY"
            'Content-Type'  = 'application/json'
        }

        try {
            Invoke-RestMethod -Uri 'https://api.sendgrid.com/v3/mail/send' `
                              -Method POST -Headers $headers -Body $payload
            Write-Host "Email sent successfully!"
            Write-Host "To  : ${{ parameters.emailTo }}"
            Write-Host "CC  : ${{ parameters.emailCC }}"
            Write-Host "From: ${{ parameters.emailFrom }}"
        }
        catch {
            $statusCode = $_.Exception.Response.StatusCode.value__
            $errBody    = $_.ErrorDetails.Message
            Write-Error "SendGrid failed. Status: $statusCode - $errBody"
            exit 1
        }